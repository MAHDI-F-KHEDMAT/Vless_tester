name: VLESS Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # هر ۶ ساعت

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tester
        run: python vless_tester.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add final_alive.txt
          git commit -m "update final_alive.txt" || echo "no changes"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
